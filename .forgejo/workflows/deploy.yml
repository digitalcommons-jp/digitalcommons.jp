name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build Astro
        run: pnpm build

      - name: Deploy to Codeberg Pages
        if: ${{ forge.ref == 'refs/heads/main' && forge.event_name != 'pull_request' }}
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://${{ forge.repository_owner }}.codeberg.page/digitalcommons.jp/
          server: codeberg.page
          token: ${{ forge.token }}
          source: dist
