# Sveltia CMS config. This file is public: no secrets here.
# Local editing: open the CMS (secret path: CMS_PATH in .env) in Chrome/Edge and choose "Work with Local Repository".
backend:
  name: gitea
  repo: digitalcommons/site
  branch: main
  base_url: https://codeberg.org
  api_root: https://codeberg.org/api/v1
  # Public client (PKCE, no secret). Its redirect URI is https://digitalcommons.jp/<CMS_PATH>.
  app_id: 2a48ad7c-a11f-4919-8b8f-92665f30904f

site_url: https://digitalcommons.jp
app_title: digital commons

media_folder: /public/uploads
public_folder: /uploads

collections:
  - name: posts
    label: 記事
    label_singular: 記事
    folder: src/content/posts
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    # Images live next to the posts so Astro can optimize them (image: ./images/cover.jpg).
    media_folder: /src/content/posts/images
    public_folder: ./images
    summary: '{{title}} ({{date | date("YYYY-MM-DD")}})'
    sortable_fields: [date, title]
    fields:
      - { name: title, label: タイトル, widget: string }
      - { name: description, label: 要約, widget: text, hint: 一覧カード・RSS・SNS 投稿に使います }
      - { name: date, label: 公開日, widget: datetime, type: date, format: 'YYYY-MM-DD' }
      - { name: updated, label: 更新日, widget: datetime, type: date, format: 'YYYY-MM-DD', required: false }
      - name: tags
        label: タグ
        widget: list
        required: false
        hint: イベントの記事には「event」を付けます
      - { name: image, label: カバー画像, widget: image, required: false }
      - { name: draft, label: 下書き, widget: boolean, default: false, hint: オンにするとサイトに出ません }
      - {
          name: social,
          label: 配信する,
          widget: boolean,
          default: false,
          hint: RSS・standard.site・Fediverse に配信します,
        }
      - {
          name: event,
          label: イベント情報,
          widget: object,
          required: false,
          hint: 'タグに「event」を付けた記事のみ',
          fields:
            [
              { name: start, label: 開始, widget: datetime, format: 'YYYY-MM-DDTHH:mm:ssZ' },
              { name: end, label: 終了, widget: datetime, format: 'YYYY-MM-DDTHH:mm:ssZ', required: false },
              { name: mode, label: 開催形態, widget: select, options: [offline, online, hybrid], default: offline },
              { name: when, label: 日時の表示（任意。例：2026年未定）, widget: string, required: false },
              { name: fee, label: 参加費（例：無料）, widget: string, required: false },
              { name: pickup, label: ピックアップ（イベントページの先頭に大きく表示）, widget: boolean, default: false },
              { name: venue, label: 会場, widget: string, required: false },
              { name: address, label: 住所, widget: string, required: false },
              { name: onlineUrl, label: オンライン URL, widget: string, required: false },
              {
                name: contact,
                label: 申込・問い合わせ先,
                widget: string,
                required: false,
                hint: 'mailto:info@digitalcommons.jp',
              },
              { name: status, label: 状態, widget: select, options: [scheduled, cancelled, done], default: scheduled },
            ],
        }
      - { name: body, label: 本文, widget: markdown }

  - name: projects
    label: プロジェクト
    label_singular: プロジェクト
    folder: src/content/projects
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    media_folder: /src/content/projects/images
    public_folder: ./images
    summary: '{{title}}'
    fields:
      - { name: title, label: タイトル, widget: string }
      - { name: description, label: 説明, widget: text }
      - { name: goal, label: 目標, widget: string }
      - { name: deliverable, label: 成果物, widget: string }
      - { name: pickup, label: ピックアップ（プロジェクトページの先頭に大きく表示）, widget: boolean, default: false }
      - { name: date, label: 開始日, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }
      - { name: status, label: 状態, widget: select, options: [ongoing, done], default: ongoing }
      - { name: url, label: リンク先 URL, widget: string, required: false }
      - { name: image, label: 画像, widget: image, required: false }
      - { name: body, label: 本文, widget: markdown, required: false }

  - name: pages
    label: 固定ページ
    label_singular: 固定ページ
    folder: src/content/pages
    media_folder: /src/content/pages/images
    public_folder: ./images
    extension: md
    format: frontmatter
    create: false
    delete: false
    slug: '{{slug}}'
    fields:
      - { name: title, label: タイトル, widget: string }
      - { name: description, label: 説明, widget: text }
      - { name: slug, label: スラッグ, widget: string, readonly: true }
      - { name: image, label: ヒーロー画像（右側に表示。あれば下の「図の種」より優先）, widget: image, required: false }
      - { name: art, label: ヒーローの図の種（任意の単語。同じ語なら同じ図が生成される）, widget: string, required: false }
      - { name: artPosition, label: 図の位置, widget: select, options: [{ label: タイトルの横, value: title }, { label: 本文の横, value: body }], default: title, required: false }
      - { name: artWrap, label: 本文を図に回り込ませる（オフなら図の横に本文を揃える）, widget: boolean, default: true, required: false }
      # 以下は「私たちについて」ページだけが使う。
      - { name: lead, label: ヒーローの本文（空行で段落を分ける）, widget: text, required: false }
      - name: mission
        label: ミッション
        widget: object
        required: false
        fields:
          - { name: title, label: 見出し, widget: string }
          - { name: text, label: 本文（**太字** が使える）, widget: text }
      - name: approaches
        label: 活動の柱
        widget: list
        required: false
        fields:
          - { name: title, label: 見出し, widget: string }
          - { name: text, label: 説明, widget: text }
      - name: members
        label: 運営メンバー
        widget: list
        required: false
        fields:
          - { name: name, label: 名前, widget: string }
          - { name: role, label: 担当, widget: string }
          - { name: bluesky, label: Bluesky の URL, widget: string, required: false }
          - { name: mastodon, label: Mastodon の URL, widget: string, required: false }
          - { name: didwebvh, label: did:webvh の URL, widget: string, required: false }
          - name: pgp
            label: PGP 鍵
            widget: object
            required: false
            fields:
              - { name: fingerprint, label: フィンガープリント, widget: string }
              - { name: file, label: 鍵ファイルのパス（public/ 以下。例 /keys/name.asc）, widget: string }
      - name: donation
        label: 寄付の案内
        widget: object
        required: false
        fields:
          - { name: title, label: 見出し, widget: string }
          - { name: text, label: 説明, widget: text }
          - { name: button, label: ボタンの文言, widget: string }
          - { name: href, label: ボタンのリンク先, widget: string }
      - name: overview
        label: 団体概要
        widget: list
        required: false
        fields:
          - { name: label, label: 項目, widget: string }
          - { name: value, label: 内容, widget: string }
      # 以下は「参加する」ページだけが使う。
      - name: audience
        label: どんな人を探しているか
        widget: object
        required: false
        fields:
          - { name: title, label: 見出し, widget: string }
          - { name: note, label: 見出しの下の注記, widget: string, required: false }
          - { name: items, label: 項目, widget: list, field: { name: item, label: 内容, widget: string } }
      - name: roles
        label: 役割の例
        widget: object
        required: false
        fields:
          - { name: title, label: 見出し, widget: string }
          - { name: note, label: 見出しの下の注記, widget: string, required: false }
          - { name: items, label: 項目, widget: list, field: { name: item, label: 内容, widget: string } }
      - name: steps
        label: 参加までの流れ（番号付きで表示）
        widget: object
        required: false
        fields:
          - { name: title, label: 見出し, widget: string }
          - { name: note, label: 見出しの下の注記, widget: string, required: false }
          - { name: items, label: 項目, widget: list, field: { name: item, label: 内容, widget: string } }
      - name: contact
        label: お申し込み・お問い合わせ
        widget: object
        required: false
        fields:
          - { name: title, label: 見出し, widget: string }
          - { name: text, label: 説明, widget: text }
          - { name: button, label: ボタンの文言, widget: string }
          - { name: href, label: ボタンのリンク先, widget: string }
      - name: follow
        label: 最新情報を受け取る
        widget: object
        required: false
        fields:
          - { name: title, label: 見出し, widget: string }
          - { name: text, label: 説明, widget: text }
          - name: items
            label: 方法
            widget: list
            fields:
              - { name: label, label: 名前, widget: string }
              - { name: text, label: 説明, widget: text }
              - { name: href, label: リンク先（名前をリンクにする場合）, widget: string, required: false }
      - { name: body, label: 本文, widget: markdown, required: false }

  - name: settings
    label: 設定
    files:
      - name: site
        label: サイト情報
        file: src/content/settings/site.yml
        fields:
          - { name: name, label: サイト名, widget: string }
          - { name: tagline, label: キャッチコピー, widget: string }
          - { name: description, label: サイト説明（meta description）, widget: text }
          - { name: email, label: 連絡先メール, widget: string }
          - { name: fediverse, label: Fediverse アカウント, widget: string }
          - { name: bluesky, label: Bluesky ハンドル, widget: string }
