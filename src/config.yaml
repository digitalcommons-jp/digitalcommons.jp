site:
  name: digital commons
  site: 'https://digitalcommons.jp'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: false

# Default SEO metadata
metadata:
  title:
    default: 一般社団法人 digital commons
    template: '%s — digital commons'
  description: 'みんなのインターネットをつくる。オープンソース文化の醸成とデジタルライツの擁護に取り組む一般社団法人 digital commons。'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: digital commons
    type: website
  twitter:
    handle: ''
    site: ''
    cardType: summary

i18n:
  language: ja
  textDirection: ltr

# Blog routes of the AstroWind template are unused: posts are served by src/pages/posts.
apps:
  blog:
    isEnabled: false

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'light'
