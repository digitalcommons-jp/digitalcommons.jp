site:
  name: Digital Commons Japan
  site: 'https://digico.codeberg.page'
  base: '/digitalcommons.jp'
  trailingSlash: false

  googleSiteVerificationId: false

# Default SEO metadata
metadata:
  title:
    default: Digital Commons Japan
    template: '%s — Digital Commons Japan'
  description: 'オープンなデジタル基盤と共有される知を育てるコミュニティ。デジタルコモンズを、日本からひらく。'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Digital Commons Japan
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: ''
    site: ''
    cardType: summary_large_image

i18n:
  language: ja
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 8

    post:
      isEnabled: true
      permalink: '/blog/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'system'
