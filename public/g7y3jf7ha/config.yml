# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

# Content is edited on Codeberg (Forgejo).
backend:
  name: gitea
  repo: digico/digitalcommons.jp
  base_url: https://codeberg.org
  api_root: https://codeberg.org/api/v1
  # PKCE OAuth (Codeberg OAuth2 app, non-confidential)
  # Redirect URI: https://digico.codeberg.page/digitalcommons.jp/g7y3jf7ha/
  app_id: 2a48ad7c-a11f-4919-8b8f-92665f30904f
  branch: main

media_folder: src/assets/images
public_folder: '~/assets/images'

output:
  omit_empty_optional_fields: true

collections:
  - name: post
    label: Posts
    label_singular: Post
    description: ブログ記事（src/data/post）
    folder: src/data/post
    create: true
    delete: true
    slug: '{{slug}}'
    extension: md
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish Date, name: publishDate, widget: datetime, type: date, required: false }
      - { label: Update Date, name: updateDate, widget: datetime, type: date, required: false }
      - { label: Draft, name: draft, widget: boolean, default: false, required: false }
      - { label: Excerpt, name: excerpt, widget: text, required: false }
      - { label: Image, name: image, widget: image, required: false }
      - { label: Image Alt, name: imageAlt, widget: string, required: false }
      - { label: Category, name: category, widget: string, required: false }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Author, name: author, widget: string, required: false }
      - { label: Body, name: body, widget: markdown }
