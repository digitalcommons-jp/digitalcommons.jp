# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: yno9/digitalcommons.jp
  branch: main

# Local development without GitHub auth (optional):
# backend:
#   name: test-repo
#   branch: main

media_folder: public/media
public_folder: /digitalcommons.jp/media

# Keep empty optional fields out of frontmatter so Astro schemas stay clean.
output:
  omit_empty_optional_fields: true

collections:
  - name: settings
    label: Settings
    description: サイト全体の基本情報
    files:
      - name: site
        label: Site
        file: src/content/settings/site.json
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Tagline, name: tagline, widget: string }
          - { label: Description, name: description, widget: text }
          - { label: Primary CTA label, name: ctaLabel, widget: string }
          - { label: Primary CTA href, name: ctaHref, widget: string }
          - { label: Contact email, name: contactEmail, widget: string }

  - name: home
    label: Home
    description: トップページのコピー
    files:
      - name: hero
        label: Hero
        file: src/content/home/hero.json
        fields:
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: Heading, name: heading, widget: text }
          - { label: Lead, name: lead, widget: text }
          - { label: Primary button, name: primaryLabel, widget: string }
          - { label: Primary button href, name: primaryHref, widget: string }
      - name: about
        label: About
        file: src/content/home/about.json
        fields:
          - { label: Heading, name: heading, widget: string }
          - { label: Lead, name: lead, widget: text }
          - label: Cards
            name: cards
            widget: list
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Body, name: body, widget: text }
      - name: join
        label: Join CTA
        file: src/content/home/join.json
        fields:
          - { label: Heading, name: heading, widget: string }
          - { label: Body, name: body, widget: text }
          - { label: Button label, name: buttonLabel, widget: string }
          - { label: Button href, name: buttonHref, widget: string }

  - name: projects
    label: Projects
    label_singular: Project
    description: トップに並ぶプロジェクト
    folder: src/content/projects
    create: true
    delete: true
    slug: "{{slug}}"
    extension: md
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Tag, name: tag, widget: string }
      - { label: Summary, name: summary, widget: text }
      - { label: Order, name: order, widget: number, value_type: int, default: 0 }
      - { label: Link label, name: linkLabel, widget: string, required: false }
      - { label: Link href, name: linkHref, widget: string, required: false }
      - { label: Body, name: body, widget: markdown, required: false }

  - name: posts
    label: Posts
    label_singular: Post
    description: ニュース / ブログ（将来用）
    folder: src/content/posts
    create: true
    delete: true
    slug: "{{slug}}"
    extension: md
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, type: date }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Summary, name: summary, widget: text, required: false }
      - { label: Body, name: body, widget: markdown }
